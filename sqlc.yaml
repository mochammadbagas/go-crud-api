version: "2"
sql:
  - schema: "db/migrations"
    queries: "db/queries"
    engine: "mysql"
    gen:
      go:
        package: "sqlc"
        out: "internal/repository/sqlc"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_empty_slices: true
        emit_exact_table_names: true
